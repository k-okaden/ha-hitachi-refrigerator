# 冷蔵庫ダッシュボード
#
# 使い方: 設定 → ダッシュボード → ダッシュボードを追加 → 「新しいダッシュボードを最初から作成」
#         → 開いて右上の鉛筆 → ︙ → 「YAML 編集」に、このファイルの中身を貼り付ける
title: 冷蔵庫
views:
  - title: 冷蔵庫
    path: fridge
    icon: mdi:fridge-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 冷蔵室
            heading_style: title
            badges:
              - type: entity
                entity: sensor.hitachi_fridge_last_captured
                show_state: true
                show_icon: true
                icon: mdi:camera-timer
          - type: picture-entity
            entity: camera.hitachi_fridge_center
            name: 棚
            camera_view: auto
            show_state: false
            grid_options:
              columns: full
          - type: picture-entity
            entity: camera.hitachi_fridge_left
            name: 左ドアポケット
            camera_view: auto
            show_state: false
            grid_options:
              columns: 6
          - type: picture-entity
            entity: camera.hitachi_fridge_right
            name: 右ドアポケット
            camera_view: auto
            show_state: false
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: 運転状況
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.hitachi_fridge_power_saving_active
                show_state: true
                show_icon: true
                icon: mdi:leaf
              - type: entity
                entity: binary_sensor.hitachi_fridge_problem
                show_state: true
                show_icon: true
          - type: tile
            entity: sensor.hitachi_fridge_door_open_count_today
            name: 今日のドア開閉
            icon: mdi:door-open
          - type: tile
            entity: sensor.hitachi_fridge_door_open_count_yesterday
            name: 昨日のドア開閉
            icon: mdi:history
          - type: tile
            entity: sensor.hitachi_fridge_fridge_door_open_time_today
            name: 冷蔵室ドア 開放時間
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.hitachi_fridge_drawer_open_time_today
            name: 引出ドア 開放時間
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.hitachi_fridge_fridge_setting
            name: 冷蔵室
            icon: mdi:fridge-top
          - type: tile
            entity: sensor.hitachi_fridge_ice_mode
            name: 製氷室
            icon: mdi:cube-outline
          - type: tile
            entity: sensor.hitachi_fridge_freezer_setting
            name: 冷凍室
            icon: mdi:snowflake
          - type: tile
            entity: binary_sensor.hitachi_fridge_quick_cooling_mode
            name: クイック冷却
            icon: mdi:fan
          - type: tile
            entity: binary_sensor.hitachi_fridge_power_saving_mode
            name: 節電モード
            icon: mdi:leaf
          - type: tile
            entity: binary_sensor.hitachi_fridge_water_tank_empty
            name: 給水タンク
            icon: mdi:water-alert
          - type: history-graph
            title: ドア開閉回数
            hours_to_show: 48
            entities:
              - entity: sensor.hitachi_fridge_door_open_count_today
                name: 開閉回数
      - type: grid
        cards:
          - type: heading
            heading: 撮影の記録
            heading_style: title
          - type: tile
            entity: sensor.hitachi_fridge_last_captured
            name: 最終撮影 (≒最後にドアを開けた時刻)
            icon: mdi:door-open
            grid_options:
              columns: full
          - type: logbook
            target:
              entity_id: sensor.hitachi_fridge_last_captured
            hours_to_show: 48
            title: 最近の撮影
