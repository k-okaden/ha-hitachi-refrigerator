<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#cfd9e2"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <rect x="58" y="14" width="140" height="228" rx="22" fill="url(#body)" stroke="#37474f" stroke-width="8"/>
  <!-- door splits: refrigerator / ice + freezer / vegetable drawers -->
  <line x1="58" y1="132" x2="198" y2="132" stroke="#37474f" stroke-width="7"/>
  <line x1="58" y1="190" x2="198" y2="190" stroke="#37474f" stroke-width="6"/>
  <line x1="128" y1="14" x2="128" y2="132" stroke="#37474f" stroke-width="6"/>
  <!-- handles -->
  <rect x="112" y="78" width="9" height="40" rx="4.5" fill="#37474f"/>
  <rect x="135" y="78" width="9" height="40" rx="4.5" fill="#37474f"/>
  <rect x="104" y="145" width="48" height="9" rx="4.5" fill="#37474f"/>
  <rect x="104" y="203" width="48" height="9" rx="4.5" fill="#37474f"/>
  <!-- camera at the top -->
  <circle cx="128" cy="44" r="20" fill="#263238"/>
  <circle cx="128" cy="44" r="13" fill="url(#lens)"/>
  <circle cx="123" cy="39" r="4" fill="#ffffff" opacity="0.85"/>
  <!-- snowflake accent -->
  <g stroke="#0288d1" stroke-width="5" stroke-linecap="round" transform="translate(176 166)">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5"/>
    <line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5"/>
  </g>
</svg>
